services:
  broker:
    build: ./broker

  servidor-cs-1:
    build:
      context: .
      dockerfile: csharp/Dockerfile
    image: sd-csharp
    command: dotnet servidor/Servidor.dll
    environment:
      - NOME=servidor-cs-1
    volumes:
      - ./dados/servidor-cs-1:/app/dados
    depends_on:
      - broker

  servidor-cs-2:
    build:
      context: .
      dockerfile: csharp/Dockerfile
    image: sd-csharp
    command: dotnet servidor/Servidor.dll
    environment:
      - NOME=servidor-cs-2
    volumes:
      - ./dados/servidor-cs-2:/app/dados
    depends_on:
      - broker

  servidor-py-1:
    build:
      context: .
      dockerfile: python/Dockerfile
    image: sd-python
    command: python servidor.py
    environment:
      - NOME=servidor-py-1
    volumes:
      - ./dados/servidor-py-1:/app/dados
    depends_on:
      - broker

  servidor-py-2:
    build:
      context: .
      dockerfile: python/Dockerfile
    image: sd-python
    command: python servidor.py
    environment:
      - NOME=servidor-py-2
    volumes:
      - ./dados/servidor-py-2:/app/dados
    depends_on:
      - broker

  bot-cs-1:
    build:
      context: .
      dockerfile: csharp/Dockerfile
    image: sd-csharp
    command: dotnet cliente/Cliente.dll
    environment:
      - NOME=bot-cs-1
    depends_on:
      - broker

  bot-cs-2:
    build:
      context: .
      dockerfile: csharp/Dockerfile
    image: sd-csharp
    command: dotnet cliente/Cliente.dll
    environment:
      - NOME=bot-cs-2
    depends_on:
      - broker
